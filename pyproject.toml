[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "whisper-voice-assistant"
version = "0.1.0"
description = "Self-hosted voice assistant: Whisper speech-to-text, a local LLM, and Kokoro text-to-speech behind one FastAPI app."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [{ name = "Kushal Dave" }]
keywords = ["whisper", "tts", "speech", "fastapi", "local-llm", "kokoro"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
  "torch",
  "openai-whisper",
  "kokoro>=0.9.4",
  "transformers",
  "fastapi",
  "uvicorn",
  "python-multipart",
  "soundfile",
  "numpy",
  "jiwer",
  "datasets",
]

[project.urls]
Homepage = "https://github.com/kushaldave002/Whisper_Voice_Assistant"
Repository = "https://github.com/kushaldave002/Whisper_Voice_Assistant"

[tool.setuptools]
py-modules = ["app", "evaluate"]
